$kind: http-request
name: 'TC-ITEMS-001: Create item with board_id and item_name returns the item id and the same name'
description: |-
  Type: Positive
  Priority: High

  Preconditions:
  None

  Cleanup:
  Delete the created item by API
method: POST
url: '{{BASE_URL}}'
order: 1000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "mutation ($board: ID!, $name: String!, $group: String, $values: JSON) { create_item(board_id: $board, item_name: $name, group_id: $group, column_values: $values) { id name } }",
      "variables": {
        "board": "{{BOARD_ID}}",
        "name": "{{itemName}}"
      }
    }
scripts:
- type: beforeRequest
  code: |-
    // test data: unique item name
    pm.collectionVariables.set('itemName', `AT - ${pm.variables.replaceIn('{{$randomProductName}}')}`);
  language: text/javascript
- type: afterResponse
  code: |-
    const sendQuery = async (query, variables) => {
        const response = await pm.sendRequest({
            url: pm.environment.get('BASE_URL'),
            method: 'POST',
            header: {
                'Content-Type': 'application/json',
                'API-Version': pm.environment.get('API_VERSION'),
                'Authorization': pm.environment.get('API_TOKEN')
            },
            body: { mode: 'raw', raw: JSON.stringify({ query, variables }) }
        });
        return response.json();
    };

    // status code
    pm.test('Status code should be 200', function () {
        pm.response.to.have.status(200);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should not have errors', function () {
        pm.expect(jsonData.errors).to.be.undefined;
    });
    pm.test('Response body should contain the item id', function () {
        pm.expect(jsonData.data.create_item.id).to.be.a('string').and.not.empty;
    });
    pm.test('Response body should contain the same name', function () {
        pm.expect(jsonData.data.create_item.name).to.eql(pm.collectionVariables.get('itemName'));
    });

    // cleanup: delete the created item by API (only if the API created one)
    const createdId = jsonData && jsonData.data && jsonData.data.create_item && jsonData.data.create_item.id;
    if (createdId) {
        try {
            await sendQuery("mutation ($item: ID!) { delete_item(item_id: $item) { id } }", { item: createdId });
        } catch (err) {
            console.error(err);
        }
    }
  language: text/javascript
