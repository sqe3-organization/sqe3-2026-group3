$kind: http-request
method: POST
url: '{{FAKE_BASE_URL}}/auth/login'
order: 1000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{FAKE_USER}}",
      "password": "{{FAKE_PASSWORD}}",
      "expiresInMins": 30
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status code is 200', () => pm.response.to.have.status(200));
    const body = pm.response.json();
    pm.test('accessToken is returned', () => pm.expect(body.accessToken).to.be.a('string').and.not.empty);
    pm.environment.set('FAKE_ACCESS_TOKEN', body.accessToken);
  language: text/javascript
