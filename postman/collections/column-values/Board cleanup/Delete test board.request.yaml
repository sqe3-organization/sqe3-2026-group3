$kind: http-request
method: POST
url: '{{BASE_URL}}'
order: 1000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "mutation ($board: ID!) { delete_board(board_id: $board) { id } }",
      "variables": {
        "board": "{{BOARD_ID}}"
      }
    }
scripts:
- type: afterResponse
  code: |-
    // status code
    pm.test('Status code should be 200', function () {
        pm.response.to.have.status(200);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should not have errors', function () {
        pm.expect(jsonData.errors).to.be.undefined;
    });
    pm.test('Response body should contain the board id', function () {
        pm.expect(jsonData.data.delete_board.id).to.eql(pm.collectionVariables.get('BOARD_ID'));
    });
  language: text/javascript
