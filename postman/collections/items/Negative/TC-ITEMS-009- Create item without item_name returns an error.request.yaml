$kind: http-request
name: 'TC-ITEMS-009: Create item without item_name returns an error'
description: |-
  Type: Negative
  Priority: High

  Preconditions:
  Count the items on the board

  Cleanup:
  None
method: POST
url: '{{BASE_URL}}'
order: 1000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "mutation ($board: ID!) { create_item(board_id: $board) { id name } }",
      "variables": {
        "board": "{{BOARD_ID}}"
      }
    }
scripts:
- type: beforeRequest
  code: |-
    const sendQuery = async (query, variables) => {
        const response = await pm.sendRequest({
            url: pm.environment.get('BASE_URL'),
            method: 'POST',
            header: {
                'Content-Type': 'application/json',
                'API-Version': pm.environment.get('API_VERSION'),
                'Authorization': pm.environment.get('API_TOKEN')
            },
            body: { mode: 'raw', raw: JSON.stringify({ query, variables }) }
        });
        return response.json();
    };

    // precondition: count the items on the board
    try {
        const before = await sendQuery("query ($ids: [ID!]) { boards(ids: $ids) { items_count } }", { ids: [pm.collectionVariables.get('BOARD_ID')] });
        pm.collectionVariables.set('ITEMS_BEFORE', String(before.data.boards[0].items_count));
    } catch (err) {
        console.error(err);
    }
  language: text/javascript
- type: afterResponse
  code: |-
    const sendQuery = async (query, variables) => {
        const response = await pm.sendRequest({
            url: pm.environment.get('BASE_URL'),
            method: 'POST',
            header: {
                'Content-Type': 'application/json',
                'API-Version': pm.environment.get('API_VERSION'),
                'Authorization': pm.environment.get('API_TOKEN')
            },
            body: { mode: 'raw', raw: JSON.stringify({ query, variables }) }
        });
        return response.json();
    };

    // status code (to verify on the first run: GraphQL validation errors can come as 200 or 400)
    pm.test('Status code should be 200 or 400', function () {
        pm.expect([200, 400]).to.include(pm.response.code);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should contain an errors array', function () {
        pm.expect(jsonData.errors).to.be.an('array').that.is.not.empty;
    });
    pm.test('Error message should be the expected one', function () {
        pm.expect(jsonData.errors[0].message).to.include("item_name");
    });
    pm.test('Response should not contain item data', function () {
        pm.expect(jsonData.data && jsonData.data.create_item).to.not.be.ok;
    });

    // data integrity: no item was created
    try {
        const after = await sendQuery("query ($ids: [ID!]) { boards(ids: $ids) { items_count } }", { ids: [pm.collectionVariables.get('BOARD_ID')] });
        pm.test('[Data integrity] - Board should have the same number of items', function () {
            pm.expect(Number(after.data.boards[0].items_count)).to.eql(Number(pm.collectionVariables.get('ITEMS_BEFORE')));
        });
    } catch (err) {
        pm.test('[Data integrity] - Board should be readable', function () { throw err; });
    }
  language: text/javascript
