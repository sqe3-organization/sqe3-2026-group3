$kind: http-request
method: PUT
url: '{{FAKE_BASE_URL}}/products/1'
order: 1000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated from Postman"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status code is 200', () => pm.response.to.have.status(200));
    pm.test('Title is updated', () => pm.expect(pm.response.json().title).to.eql('Updated from Postman'));
  language: text/javascript
