$kind: http-request
name: 'TC-COLVAL-020 Step 3: Read the new values'
method: POST
url: '{{BASE_URL}}'
order: 3000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "query ($ids: [ID!]) { items(ids: $ids) { id state column_values(ids: [\"status\", \"date4\", \"text\"]) { id text value } } }",
      "variables": {
        "ids": [
          "{{ITEM_ID}}"
        ]
      }
    }
scripts:
- type: afterResponse
  code: |-
    // status code
    pm.test('Status code should be 200', function () {
        pm.response.to.have.status(200);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should not have errors', function () {
        pm.expect(jsonData.errors).to.be.undefined;
    });
    const columns = {};
    jsonData.data.items[0].column_values.forEach(c => { columns[c.id] = c; });
    pm.test('Status should be Done', function () {
        pm.expect(columns.status.text).to.eql('Done');
    });
    pm.test('Date should be 2026-11-15', function () {
        pm.expect(JSON.parse(columns.date4.value).date).to.eql('2026-11-15');
    });
    pm.test('Text should be E2E text', function () {
        pm.expect(columns.text.text).to.eql('E2E text');
    });
  language: text/javascript
