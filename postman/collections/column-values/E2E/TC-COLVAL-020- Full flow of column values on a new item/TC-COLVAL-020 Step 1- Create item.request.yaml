$kind: http-request
name: 'TC-COLVAL-020 Step 1: Create item'
method: POST
url: '{{BASE_URL}}'
order: 1000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "mutation ($board: ID!, $name: String!, $values: JSON) { create_item(board_id: $board, item_name: $name, column_values: $values) { id name } }",
      "variables": {
        "board": "{{BOARD_ID}}",
        "name": "AT - COLVAL E2E",
        "values": "{}"
      }
    }
scripts:
- type: afterResponse
  code: |-
    // status code
    pm.test('Status code should be 200', function () {
        pm.response.to.have.status(200);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should not have errors', function () {
        pm.expect(jsonData.errors).to.be.undefined;
    });
    pm.test('Response body should contain the new id', function () {
        pm.expect(jsonData.data.create_item.id).to.be.a('string').and.not.empty;
    });
    pm.collectionVariables.set('ITEM_ID', jsonData.data.create_item.id);
  language: text/javascript
