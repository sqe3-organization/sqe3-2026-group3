$kind: http-request
name: 'TC-COLVAL-020 Step 5: Read the empty columns'
method: POST
url: '{{BASE_URL}}'
order: 5000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "query ($ids: [ID!]) { items(ids: $ids) { id state column_values(ids: [\"status\", \"date4\", \"text\"]) { id text value } } }",
      "variables": {
        "ids": [
          "{{ITEM_ID}}"
        ]
      }
    }
scripts:
- type: afterResponse
  code: |-
    // status code
    pm.test('Status code should be 200', function () {
        pm.response.to.have.status(200);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should not have errors', function () {
        pm.expect(jsonData.errors).to.be.undefined;
    });
    jsonData.data.items[0].column_values.forEach(c => {
        pm.test(`${c.id} should be empty`, function () {
            pm.expect(c.text || '').to.eql('');
            pm.expect(c.value).to.eql(null);
        });
    });
  language: text/javascript
