$kind: collection
name: Fake API - DummyJSON
description: Practice requests with dummyjson.com
scripts:
- type: http:afterResponse
  code: |-
    const limit = Number(pm.environment.get('RESPONSE_TIME_LIMIT_MS') || 1500);

    pm.test('Content-Type should be application/json', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
    });

    pm.test(`Response time should be less than ${limit}ms`, function () {
        pm.expect(pm.response.responseTime).to.be.below(limit);
    });
  language: text/javascript
