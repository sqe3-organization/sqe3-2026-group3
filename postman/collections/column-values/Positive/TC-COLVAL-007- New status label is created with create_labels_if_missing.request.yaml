$kind: http-request
name: 'TC-COLVAL-007: New status label is created with create_labels_if_missing'
description: |-
  Type: Positive
  Priority: Low

  Preconditions:
  Create an item by API

  Cleanup:
  Delete the item by API
method: POST
url: '{{BASE_URL}}'
order: 7000
headers:
- key: Content-Type
  value: application/json
- key: API-Version
  value: '{{API_VERSION}}'
body:
  type: json
  content: |-
    {
      "query": "mutation ($board: ID!, $item: ID!, $values: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $values, create_labels_if_missing: true) { id name } }",
      "variables": {
        "board": "{{BOARD_ID}}",
        "item": "{{ITEM_ID}}",
        "values": "{\"status\":{\"label\":\"QA Review\"}}"
      }
    }
scripts:
- type: beforeRequest
  code: |-
    const sendQuery = async (query, variables) => {
        const response = await pm.sendRequest({
            url: pm.environment.get('BASE_URL'),
            method: 'POST',
            header: {
                'Content-Type': 'application/json',
                'API-Version': pm.environment.get('API_VERSION'),
                'Authorization': pm.environment.get('API_TOKEN')
            },
            body: { mode: 'raw', raw: JSON.stringify({ query, variables }) }
        });
        return response.json();
    };

    // precondition: create the item by API
    pm.collectionVariables.set('itemName', `AT - ${pm.variables.replaceIn('{{$randomProductName}}')}`);
    try {
        const created = await sendQuery("mutation ($board: ID!, $name: String!, $values: JSON) { create_item(board_id: $board, item_name: $name, column_values: $values) { id name } }", {
            board: pm.collectionVariables.get('BOARD_ID'),
            name: pm.collectionVariables.get('itemName'),
            values: "{\"status\":{\"label\":\"Working on it\"},\"date4\":{\"date\":\"2026-11-01\"},\"text\":\"Initial text\"}"
        });
        pm.collectionVariables.set('ITEM_ID', created.data.create_item.id);
    } catch (err) {
        console.error(err);
    }
  language: text/javascript
- type: afterResponse
  code: |-
    const sendQuery = async (query, variables) => {
        const response = await pm.sendRequest({
            url: pm.environment.get('BASE_URL'),
            method: 'POST',
            header: {
                'Content-Type': 'application/json',
                'API-Version': pm.environment.get('API_VERSION'),
                'Authorization': pm.environment.get('API_TOKEN')
            },
            body: { mode: 'raw', raw: JSON.stringify({ query, variables }) }
        });
        return response.json();
    };

    // status code
    pm.test('Status code should be 200', function () {
        pm.response.to.have.status(200);
    });

    // response body
    const jsonData = pm.response.json();
    pm.test('Response should not have errors', function () {
        pm.expect(jsonData.errors).to.be.undefined;
    });
    pm.test('Response body should contain the item id', function () {
        pm.expect(jsonData.data.change_multiple_column_values.id).to.eql(pm.collectionVariables.get('ITEM_ID'));
    });

    // data integrity
    try {
        const check = await sendQuery("query ($ids: [ID!]) { items(ids: $ids) { id state column_values(ids: [\"status\", \"date4\", \"text\"]) { id text value } } }", { ids: [pm.collectionVariables.get('ITEM_ID')] });
        const columns = {};
        check.data.items[0].column_values.forEach(c => { columns[c.id] = c; });
        pm.test("[Data integrity] - Status should be QA Review", function () {
            pm.expect(columns.status.text).to.eql("QA Review");
        });
        pm.test("[Data integrity] - Date should be 2026-11-01", function () {
            pm.expect(JSON.parse(columns.date4.value).date).to.eql("2026-11-01");
        });
        pm.test("[Data integrity] - Text should be Initial text", function () {
            pm.expect(columns.text.text).to.eql("Initial text");
        });
    } catch (err) {
        pm.test('[Data integrity] - Item should be readable', function () { throw err; });
    }

    // data integrity
    try {
        const board = await sendQuery("query ($ids: [ID!]) { boards(ids: $ids) { columns(ids: [\"status\"]) { settings_str } } }", { ids: [pm.collectionVariables.get('BOARD_ID')] });
        const labels = JSON.parse(board.data.boards[0].columns[0].settings_str).labels;
        pm.test('[Data integrity] - QA Review should exist on the board', function () {
            pm.expect(Object.values(labels)).to.include('QA Review');
        });
    } catch (err) {
        pm.test('[Data integrity] - Board should be readable', function () { throw err; });
    }

    // cleanup: delete the item by API
    try {
        await sendQuery("mutation ($item: ID!) { delete_item(item_id: $item) { id } }", { item: pm.collectionVariables.get('ITEM_ID') });
    } catch (err) {
        console.error(err);
    }
  language: text/javascript
