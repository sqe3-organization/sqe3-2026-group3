$kind: http-request
method: GET
url: '{{FAKE_BASE_URL}}/auth/me'
order: 1000
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{FAKE_ACCESS_TOKEN}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status code is 200', () => pm.response.to.have.status(200));
    pm.test('Username matches the login', () => pm.expect(pm.response.json().username).to.eql(pm.environment.get('FAKE_USER')));
  language: text/javascript
